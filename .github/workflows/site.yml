name: Site

# Deploys the static documentation site in site/ to GitHub Pages.
# Custom domain hufu.yufan.dev is pinned by site/CNAME; DNS (CNAME hufu →
# syhily.github.io) is managed outside this repo. No build step: the site is
# plain HTML/CSS/JS, checked by scripts/check-site.sh.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check site links and references
        run: bash scripts/check-site.sh

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
