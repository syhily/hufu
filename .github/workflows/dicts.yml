name: Dictionaries

on:
  push:
    paths:
      - 'dicts/huma'
      - '.gitmodules'
      - 'scripts/stage-huma.sh'
      - 'scripts/dictionary-metadata.py'
      - 'SharedSupport/hufu/**'
      - 'SharedSupport/hufu.yaml'
  pull_request:
    paths:
      - 'dicts/huma'
      - '.gitmodules'
      - 'scripts/stage-huma.sh'
      - 'scripts/dictionary-metadata.py'
      - 'SharedSupport/hufu/**'
      - 'SharedSupport/hufu.yaml'

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Fetch librime (OpenCC data)
        run: bash scripts/fetch-librime.sh

      - name: Assemble dictionaries
        run: |
          mkdir -p Packages/HufuKit/.build
          bash scripts/stage-huma.sh

      - name: Check dictionary metadata
        run: python3 scripts/dictionary-metadata.py --shared-dir build/SharedSupport --check
