name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix) builds, signs/notarizes when secrets exist and
# drafts a GitHub Release. Running it by hand is a dry run: artefacts are uploaded to the
# workflow run only, no release is created. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build as (dry run, e.g. v0.2.0); no release is created
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      status: ${{ steps.artefacts.outputs.status }}
      prerelease: ${{ steps.artefacts.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must look like v1.2.3 or v1.2.3-beta.1, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up build (Xcode, XcodeGen, librime, dictionaries)
        uses: ./.github/actions/setup-build

      # All seven secrets → Developer ID signed + notarized. None → ad-hoc preview.
      # A partial set is a configuration mistake and fails instead of silently going unsigned.
      - name: Detect signing secrets
        id: signing
        env:
          MACOS_DEVELOPER_ID_APP_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          names=(MACOS_DEVELOPER_ID_APP_P12_BASE64 MACOS_DEVELOPER_ID_APP_P12_PASSWORD
                 MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64 MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD
                 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY_P8_BASE64)
          missing=()
          for n in "${names[@]}"; do [[ -n "${!n}" ]] || missing+=("$n"); done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and notarization enabled"
          elif [[ ${#missing[@]} -eq ${#names[@]} ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building an ad-hoc signed preview (not notarized)"
          else
            echo "::error::Incomplete signing secrets, missing: ${missing[*]}"
            exit 1
          fi

      - name: Import signing identities into a temporary keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_DEVELOPER_ID_APP_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          SECRETS_DIR="$RUNNER_TEMP/hufu-signing"
          KEYCHAIN="$SECRETS_DIR/hufu-signing.keychain-db"
          mkdir -p "$SECRETS_DIR" && chmod 700 "$SECRETS_DIR"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_DEVELOPER_ID_APP_P12_BASE64" | base64 --decode > "$SECRETS_DIR/app.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64" | base64 --decode > "$SECRETS_DIR/installer.p12"
          security import "$SECRETS_DIR/app.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$MACOS_DEVELOPER_ID_APP_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security import "$SECRETS_DIR/installer.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/pkgbuild >/dev/null
          rm -f "$SECRETS_DIR/app.p12" "$SECRETS_DIR/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend to the user search list so codesign / xcodebuild / productbuild find the identities.
          existing=()
          while IFS= read -r k; do existing+=("$(echo "$k" | tr -d ' "')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"

          # -v lists only valid identities: expired or revoked certificates are excluded,
          # which matters because macOS treats code signed with a revoked certificate as malware.
          # The throwaway keychain contains only what we just imported, so the first
          # Developer ID identity of each kind is ours — no team filter needed.
          app_id="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/"Developer ID Application: / {print $2; exit}')"
          installer_id="$(security find-identity -v -p basic "$KEYCHAIN" \
            | awk '/"Developer ID Installer: / {print $2; exit}')"
          [[ -n "$app_id" ]] || { echo "::error::No valid 'Developer ID Application' identity imported"; exit 1; }
          [[ -n "$installer_id" ]] || { echo "::error::No valid 'Developer ID Installer' identity imported"; exit 1; }

          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$SECRETS_DIR/AuthKey.p8"
          chmod 600 "$SECRETS_DIR/AuthKey.p8"
          {
            echo "HUFU_SIGN_IDENTITY=$app_id"
            echo "HUFU_INSTALLER_IDENTITY=$installer_id"
            echo "HUFU_NOTARY_KEY_PATH=$SECRETS_DIR/AuthKey.p8"
            echo "HUFU_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "HUFU_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "Imported Developer ID identities $app_id (application) and $installer_id (installer)"

      - name: Build, sign, notarize and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Shorten (e.g. 3m) while Apple holds submissions for review: the wait only
          # burns runner minutes; scripts/finish-notarization.sh staples later.
          HUFU_NOTARY_WAIT: ${{ vars.HUFU_NOTARY_WAIT || '20m' }}
        run: bash scripts/release.sh "$VERSION"

      - name: Verify artefacts
        id: artefacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist/release
          shasum -a 256 -c SHA256SUMS.txt
          codesign --verify --deep --strict "$GITHUB_WORKSPACE/build/Release/Hufu.app"
          codesign -dv "$GITHUB_WORKSPACE/build/Release/Hufu.app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|Signature)=' || true
          pkgutil --check-signature "Hufu-$VERSION.pkg" || true
          status="$(cat SIGNING_STATUS)"
          if [[ "$status" == notarized ]]; then
            spctl --assess --type install --verbose=2 "Hufu-$VERSION.pkg"
            xcrun stapler validate "Hufu-$VERSION.pkg"
          elif [[ "$status" == pending ]]; then
            echo "::warning::Apple notarization still in progress; staple later with scripts/finish-notarization.sh"
            cat NOTARY_PENDING.txt
          fi
          prerelease=false
          [[ "$status" != notarized || "$VERSION" == *-* ]] && prerelease=true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          {
            echo "### Hufu $VERSION — $status"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: Hufu-${{ steps.version.outputs.version }}
          path: |
            dist/release/Hufu-*.pkg
            dist/release/Hufu-*.zip
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE_NOTES.md
            dist/release/NOTARY_PENDING.txt
            dist/release/SIGNING_STATUS
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary keychain and notary key
        if: always()
        run: |
          SECRETS_DIR="$RUNNER_TEMP/hufu-signing"
          if [[ -f "$SECRETS_DIR/hufu-signing.keychain-db" ]]; then
            security delete-keychain "$SECRETS_DIR/hufu-signing.keychain-db" || true
          fi
          rm -rf "$SECRETS_DIR"

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v8
        with:
          name: Hufu-${{ needs.build.outputs.version }}
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          STATUS: ${{ needs.build.outputs.status }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          title="Hufu $VERSION"
          [[ "$STATUS" == preview ]] && title="${title}（预览版，未签名）"
          [[ "$STATUS" == pending ]] && title="${title}（公证处理中）"
          flags=(--draft --verify-tag --title "$title" --notes-file RELEASE_NOTES.md)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "Hufu-$VERSION.pkg" "Hufu-$VERSION.zip" SHA256SUMS.txt
