name: Set up Hufu build
description: Latest stable Xcode, XcodeGen, cached vendor downloads, pinned librime and Tiger-Code dictionaries.

runs:
  using: composite
  steps:
    - name: Select latest stable Xcode
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen

    - name: Cache vendor downloads
      uses: actions/cache@v6
      with:
        path: Vendor/.cache
        key: ${{ runner.os }}-${{ runner.arch }}-vendor-${{ hashFiles('Vendor/librime.lock') }}

    - name: Fetch librime
      shell: bash
      run: bash scripts/fetch-librime.sh

    - name: Stage Tiger-Code dictionaries
      shell: bash
      run: |
        bash scripts/stage-huma.sh
