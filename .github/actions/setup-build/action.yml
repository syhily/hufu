name: Set up Hufu build
description: Latest stable Xcode, XcodeGen, cached in-tree librime build and Tiger-Code dictionaries.

runs:
  using: composite
  steps:
    - name: Select latest stable Xcode
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen

    - name: Record librime pins
      shell: bash
      run: |
        mkdir -p build
        git ls-tree HEAD Vendor/src > build/librime-submodules.txt
        shasum -a 256 scripts/build-librime.sh >> build/librime-submodules.txt

    - name: Cache in-tree librime
      uses: actions/cache@v6
      with:
        path: |
          build/rime
          Packages/HufuKit/Frameworks/CRime.xcframework
        key: ${{ runner.os }}-${{ runner.arch }}-rime-${{ hashFiles('build/librime-submodules.txt') }}

    - name: Build librime from source
      shell: bash
      run: bash scripts/build-librime.sh

    - name: Stage Tiger-Code dictionaries
      shell: bash
      run: |
        bash scripts/stage-huma.sh
