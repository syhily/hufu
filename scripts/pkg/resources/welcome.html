<h2>虎符输入法（Hufu）</h2>
<p>以 RIME 为引擎的 macOS 输入法，内置虎码官方词库与方案，用可视化的方式管理方案、外观与词库。</p>
<p>如果你正在使用鼠须管，Hufu 首次启动时会<strong>只读导入</strong> <code>~/Library/Rime</code> 中的配置、词库与词频，原目录不会被修改；两者可以共存。</p>
<p class="muted">安装位置：/Library/Input Methods/Hufu.app</p>
